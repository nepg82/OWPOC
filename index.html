<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open World POC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud">
  <div><b>W/S</b> forward / back &nbsp; <b>A/D</b> turn &nbsp; <b>SHIFT</b> jump &nbsp; <b>SPACE</b> interact / exit car &nbsp; <b>CLICK</b> lock mouse</div>
</div>
<div id="crosshair-note">proof of concept &mdash; complete world collisions</div>

<div id="prompt"></div>

<div id="modal">
  <div id="modalCard">
    <h2 id="modalTitle">Building</h2>
    <p id="modalBody">Interior not built yet in this proof of concept.</p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }
</script>
</body>
</html>
